name: Publicar no Fly.io

# Manual de propósito. O bot atende culto em horário fixo, e um deploy disparado por push
# poderia trocar a imagem no meio de uma janela, derrubando o socket com o link a caminho.
on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: culto-automacao
      # Mesma máquina que o start-bot.yml liga.
      MAQUINA: 148ee339cee098

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Antes de trocar a imagem, registra o que estava rodando. Máquina de pé fora de
      # janela de culto é sintoma, não estado normal: socket aberto é um aparelho vinculado
      # segurando a sessão da conta, e é a primeira hipótese quando o celular do dono para
      # de receber notificação. O histórico de eventos mostra desde quando e com que
      # exit_code ela parou (ou não parou).
      - name: Estado da máquina antes do deploy
        run: |
          flyctl machine list --app "$APP"
          echo "──── eventos recentes ────"
          flyctl machine status "$MAQUINA" --app "$APP" || true

      - name: Publicar imagem
        run: flyctl deploy --remote-only --app "$APP"

      # O deploy atualiza a máquina parada SEM ligá-la, e ler o volume exige máquina de pé.
      # Subir aqui também serve de teste ao vivo: o log de subida mostra o bot conectando e
      # anunciando a sessão como passiva, que é a correção publicada ontem.
      - name: Subir a máquina para ler o volume
        run: |
          ESTADO=$(flyctl machine list --app "$APP" --json | jq -r --arg id "$MAQUINA" '.[] | select(.id==$id) | .state')
          echo "Estado após o deploy: $ESTADO"
          if [ "$ESTADO" != "started" ]; then
            flyctl machine start "$MAQUINA" --app "$APP"
          fi
          sleep 30

      - name: Log de subida (conexão e anúncio de sessão passiva)
        run: timeout 30 flyctl logs --app "$APP" --no-tail || true

      # Os resumos respondem as perguntas que decidem o diagnóstico de notificação:
      # `sessaoPassiva` (falso = a conta passou a janela inteira marcada como sessão ativa)
      # e os números de reenvio da última janela.
      - name: Resumos das últimas janelas no volume
        run: |
          flyctl ssh console --app "$APP" --machine "$MAQUINA" -C "ls -la /data/diagnostico" || true
          for f in $(flyctl ssh console --app "$APP" --machine "$MAQUINA" -C "ls /data/diagnostico" 2>/dev/null | tr -d '\r' | grep '^resumo-' | sort | tail -n 4); do
            echo "══════════ $f ══════════"
            flyctl ssh console --app "$APP" --machine "$MAQUINA" -C "cat /data/diagnostico/$f" || true
          done

      - name: Fim dos logs das duas últimas janelas
        run: |
          for f in $(flyctl ssh console --app "$APP" --machine "$MAQUINA" -C "ls /data/diagnostico" 2>/dev/null | tr -d '\r' | grep -v '^resumo-' | grep '\.log$' | sort | tail -n 2); do
            echo "══════════ $f ══════════"
            flyctl ssh console --app "$APP" --machine "$MAQUINA" -C "tail -c 6000 /data/diagnostico/$f" || true
          done

      # O deploy sobe a máquina para aplicar a imagem. Fora da janela do culto ela precisa
      # voltar a ficar parada: quem liga é o cron-job.org, minutos antes de cada culto, e o
      # fly.toml usa `restart policy = never` justamente para ela não se levantar sozinha.
      # Socket aberto à toa é o que faz o WhatsApp marcar um aparelho vinculado como ativo e
      # parar de notificar o celular do dono — o problema que este projeto acabou de corrigir.
      - name: Devolver a máquina ao estado parado
        if: always()
        run: |
          flyctl machine stop "$MAQUINA" --app "$APP" || true
          flyctl machine list --app "$APP"
