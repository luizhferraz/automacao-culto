name: Iniciar bot do culto

on:
  schedule:
    - cron: '49 12 * * 0'  # Domingo 9h49 BRT  → janela da manhã (9h54)
    - cron: '54 21 * * 0'  # Domingo 18h54 BRT → janela da noite (18h59)
    - cron: '49 22 * * 3'  # Quarta  19h49 BRT → janela da noite (19h54)
  workflow_dispatch:        # permite disparar manualmente se precisar

jobs:
  start-machine:
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar máquina no Fly.io
        run: |
          curl -s -X POST \
            "https://api.machines.dev/v1/apps/culto-automacao/machines/148ee339cee098/start" \
            -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
            -H "Content-Type: application/json"
          echo "✅ Máquina iniciada"
