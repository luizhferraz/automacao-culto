app = "culto-automacao"
primary_region = "iad"

# Quanto o Fly espera entre o SIGTERM e o SIGKILL. É um teto, não uma espera: se o processo
# terminar antes, a máquina para na hora. O padrão são 5s, e o nosso encerramento não cabe
# nisso, porque ainda segura um pouco a janela de reenvio, fecha o socket e espera as
# gravações de estado de sinal drenarem. Já aconteceu de o processo ser morto no meio da
# drenagem e o resumo de diagnóstico se perder junto.
#
# Precisa ficar ACIMA de qualquer cabeçalho de tabela. Em TOML, chave solta depois de um
# [[cabeçalho]] pertence àquela tabela: colocada no fim do arquivo, ela virava
# restart[0].kill_timeout e era silenciosamente ignorada.
kill_timeout = "45s"

[build]

[env]
  TZ = "America/Sao_Paulo"
  AUTH_DIR = "/data/baileys_auth"

[mounts]
  source = "culto_data"
  destination = "/data"

[[restart]]
  policy = "never"
